const grid = document.getElementById('grid');
const searchInput = document.getElementById('search');
const voiceOptions = document.getElementById('voice-options');
const voiceNotice = document.getElementById('voice-notice');
const engToggle = document.getElementById('eng-toggle');
const genderRadios = document.querySelectorAll('input[name="gender"]');
const randomBtn = document.getElementById('random-btn');
const catChips = document.getElementById('cat-chips');
let selectedVoice = null;
let genderFilter = '';
let categoryFilter = '';

// Build entries with their category from the marker strings
const categories = [];
const entries = [];
{
  let current = null;
  for (const item of emojis) {
    if (typeof item === 'string') {
      current = { name: item, icon: '' };
      categories.push(current);
      continue;
    }
    if (!current) { current = { name: 'Divers', icon: '' }; categories.push(current); }
    const [emoji, label, gender, english] = item;
    if (!current.icon) current.icon = emoji;
    entries.push({ emoji, label, gender, english, category: current.name });
  }
}

const hasSpeech = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let frVoices = [];

const voiceLang = v => v.lang.replace('_', '-').toLowerCase();
const isFrFR = v => voiceLang(v) === 'fr-fr';

// Short button label: "Microsoft Denise Online - French" → "Denise"
const shortName = v => v.name.replace(/^(Microsoft|Apple|Google)\s+(?=\S)/i, '').split(/[\s(-]/)[0];

function loadVoices() {
  if (!hasSpeech) return;
  const voices = speechSynthesis.getVoices();
  frVoices = voices.filter(v => voiceLang(v).startsWith('fr'));
  frVoices = [...frVoices.filter(isFrFR), ...frVoices.filter(v => !isFrFR(v))];
  voiceOptions.innerHTML = '';
  if (!frVoices.length) { selectedVoice = null; return; }
  voiceNotice.hidden = true;

  // Amélie and Thomas when available, otherwise the best two other French voices
  const amelie = frVoices.find(v => /am[eé]lie/i.test(v.name));
  const thomas = frVoices.find(v => /thomas/i.test(v.name));
  const pair = [amelie, thomas].filter(Boolean);
  for (const v of frVoices) if (pair.length < 2 && !pair.includes(v)) pair.push(v);

  const saved = store.get('fr-moji-voice');
  selectedVoice = pair.find(v => v.name === saved) || pair[0];
  if (pair.length < 2) return;

  let names = pair.map(v => v === amelie ? 'Amélie' : v === thomas ? 'Thomas' : shortName(v));
  if (names[0] === names[1]) names = ['Voix 1', 'Voix 2'];
  voiceOptions.className = 'voice-radios';
  pair.forEach((voice, i) => {
    const label = document.createElement('label');
    label.title = voice.name;
    label.innerHTML = `<input type="radio" name="voice" value="${i}"><span></span>`;
    label.querySelector('span').textContent = names[i];
    const input = label.querySelector('input');
    input.checked = voice === selectedVoice;
    input.addEventListener('change', () => {
      selectedVoice = voice;
      store.set('fr-moji-voice', voice.name);
    });
    voiceOptions.appendChild(label);
  });
}

function showVoiceNotice(msg) {
  voiceNotice.textContent = msg;
  voiceNotice.hidden = false;
}

function checkFrenchVoice() {
  if (!frVoices.length) showVoiceNotice('Aucune voix française trouvée sur cet appareil. Pour entendre la prononciation, installe une voix française dans les réglages du système (Langue ou Synthèse vocale), puis recharge la page.');
}

function say(text, onend) {
  if (!hasSpeech) { if (onend) onend(); return; }
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = selectedVoice ? selectedVoice.lang : 'fr-FR';
  utter.rate = 0.9;
  if (selectedVoice) utter.voice = selectedVoice;
  if (onend) utter.onend = onend;
  speechSynthesis.speak(utter);
}

function normalize(str) {
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[\u2019\u2018\u02bc`´]/g, "'").toLowerCase().trim();
}

function stripVS(str) {
  return str.replace(/\uFE0F/g, '');
}

// Build every card and heading once; filtering only toggles `hidden`
const headings = new Map(categories.map(({ name }) => {
  const heading = document.createElement('h2');
  heading.className = 'cat-heading';
  heading.textContent = name;
  return [name, heading];
}));

const cards = entries.map((entry) => {
  const { emoji, label, gender, english, category } = entry;
  const cls = gender === 'm' ? 'masc' : gender === 'f' ? 'fem' : 'other';
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'card';
  card.dataset.label = label;
  card.setAttribute('aria-label', `${label} — écouter`);
  card.innerHTML = `<span class="emoji" aria-hidden="true">${emoji}</span><span class="label ${cls}">${label}</span><span class="eng">${english}</span>`;
  return { entry, card, gender, category, label: normalize(label), english: normalize(english), emoji: stripVS(emoji) };
});

const noResults = document.createElement('div');
noResults.className = 'no-results';
noResults.textContent = 'Aucun résultat trouvé';
noResults.hidden = true;

grid.append(...cards.flatMap((c, i) =>
  i === 0 || cards[i - 1].category !== c.category ? [headings.get(c.category), c.card] : [c.card]
), noResults);

function applyFilter() {
  const term = normalize(searchInput.value);
  let count = 0;

  const emojiTerm = stripVS(term);
  const visibleCategories = new Set();

  for (const { card, gender, category, label, english, emoji } of cards) {
    const textMatch = !term || label.includes(term) || english.includes(term) || emoji.includes(emojiTerm);
    const show = textMatch && (!genderFilter || gender === genderFilter) && (!categoryFilter || category === categoryFilter);
    card.hidden = !show;
    if (show) {
      count++;
      visibleCategories.add(category);
    }
  }

  for (const [name, heading] of headings) heading.hidden = !visibleCategories.has(name);

  noResults.hidden = count > 0;
  randomBtn.disabled = count === 0;
}

grid.addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (!card) return;
  grid.querySelectorAll('.card.speaking').forEach(c => c.classList.remove('speaking'));
  card.classList.add('speaking');
  say(card.dataset.label, () => card.classList.remove('speaking'));
});

engToggle.addEventListener('change', (e) => {
  document.body.classList.toggle('show-english', e.target.checked);
});

genderRadios.forEach(radio => {
  radio.addEventListener('change', () => {
    genderFilter = radio.value;
    applyFilter();
  });
});

// Category chips
[{ name: '', icon: '✨', text: 'Toutes' }, ...categories].forEach(({ name, icon, text }) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'cat-chip';
  btn.setAttribute('aria-pressed', String(name === categoryFilter));
  btn.innerHTML = `<span class="cat-icon" aria-hidden="true"></span><span></span>`;
  btn.firstChild.textContent = icon;
  btn.lastChild.textContent = text || name;
  btn.addEventListener('click', () => {
    categoryFilter = name;
    catChips.querySelectorAll('.cat-chip').forEach(c => c.setAttribute('aria-pressed', String(c === btn)));
    btn.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
    applyFilter();
  });
  catChips.appendChild(btn);
});

if (hasSpeech) {
  speechSynthesis.addEventListener('voiceschanged', () => {
    loadVoices();
    if (speechSynthesis.getVoices().length) checkFrenchVoice();
  });
  loadVoices();
  setTimeout(() => { loadVoices(); checkFrenchVoice(); }, 1500);
} else {
  showVoiceNotice('Ton navigateur ne prend pas en charge la synthèse vocale : la prononciation ne sera pas disponible.');
}

let searchTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applyFilter, 100);
});

// Random emoji dialog
const randomDialog = document.getElementById('random-dialog');
const rdEmoji = document.getElementById('rd-emoji');
const rdFrench = document.getElementById('rd-french');
const rdEnglish = document.getElementById('rd-english');
const rdGender = document.getElementById('rd-gender');

let lastRandom = null;

function openRandomDialog() {
  const pool = cards.filter(c => !c.card.hidden).map(c => c.entry);
  if (!pool.length) return;
  let entry;
  do entry = pool[Math.floor(Math.random() * pool.length)];
  while (pool.length > 1 && entry === lastRandom);
  lastRandom = entry;
  const { emoji, label, gender, english } = entry;
  rdEmoji.textContent = emoji;
  rdEmoji.setAttribute('aria-label', `${label} — réécouter`);
  rdFrench.textContent = label;
  rdEnglish.textContent = english;
  if (gender === 'm') {
    rdGender.textContent = 'masculin';
    rdGender.className = 'rd-gender masc';
    rdGender.style.visibility = '';
  } else if (gender === 'f') {
    rdGender.textContent = 'féminin';
    rdGender.className = 'rd-gender fem';
    rdGender.style.visibility = '';
  } else {
    rdGender.textContent = '\u00A0';
    rdGender.style.visibility = 'hidden';
  }
  rdEmoji.onclick = () => say(label);
  if (!randomDialog.open) randomDialog.showModal();
  say(label);
}

randomBtn.addEventListener('click', openRandomDialog);
document.getElementById('rd-another').addEventListener('click', openRandomDialog);
document.getElementById('rd-close').addEventListener('click', () => randomDialog.close());
randomDialog.addEventListener('click', (e) => {
  if (e.target === randomDialog) randomDialog.close();
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
}
</script>
